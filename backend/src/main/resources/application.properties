spring.config.import=optional:file:.env[.properties]
spring.application.name=music-catalog-insights
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/music_catalog}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLW1lLXRvLWEtdGhp
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
